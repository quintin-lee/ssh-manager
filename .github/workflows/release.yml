name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > VERSION
          echo "Release version: $VERSION (tag: $TAG)"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm makeself

      - name: Build packages
        run: |
          ./scripts/package.sh
          ls -lh dist/

      - name: Build self-extracting installer
        run: |
          ./scripts/build_makeself.sh
          ls -lh ssh-manager-*.run

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            ssh-manager-*.run

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, run, tarball]

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

      - name: Verify .deb
        if: matrix.format == 'deb'
        run: |
          sudo dpkg -i ssh-manager_*.deb
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== completions ==="
          test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
          test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
          source /usr/share/bash-completion/completions/sshm
          complete -p sshm && echo "bash registered: OK"
          sudo apt remove -y ssh-manager || sudo dpkg -r ssh-manager

      - name: Verify .rpm (Fedora)
        if: matrix.format == 'rpm'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace fedora:latest bash -c '
            dnf install -y expect rpm-build
            ./scripts/package.sh
            rpm -ivh dist/ssh-manager-*.noarch.rpm
            sshm --version && sshm --help
            printf "nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n" > /tmp/test-config.yaml
            sshm --config /tmp/test-config.yaml --validate
            echo "=== completions ==="
            test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
            test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
            rpm -e ssh-manager
          '

      - name: Verify .run
        if: matrix.format == 'run'
        run: |
          chmod +x ssh-manager-*.run
          sudo ./ssh-manager-*.run
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== completions ==="
          test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
          test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
          sudo sshm-uninstall || true

      - name: Verify tarball
        if: matrix.format == 'tarball'
        run: |
          TARBALL=$(echo ssh-manager-*.tar.gz)
          tar xzf "$TARBALL"
          TARDIR=$(echo ssh-manager-*/)
          cd "$TARDIR"
          chmod +x install.sh
          sudo ./install.sh
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          sudo ssh-manager-uninstall || true

  release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Generate checksums
        run: |
          > SHA256SUMS
          for f in *.deb *.rpm *.tar.gz; do
            [[ -f "$f" ]] && sha256sum "$f" >> SHA256SUMS
          done
          for f in ssh-manager-*.run; do
            [[ -f "$f" ]] && sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SSH Manager v${{ env.VERSION }}"
          body: |
            ## SSH Manager v${{ env.VERSION }}

            ### Installation

            **Self-extracting (all Linux):**
            ```bash
            sudo ./ssh-manager-${{ env.VERSION }}.run
            ```

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i ssh-manager_${{ env.VERSION }}-1_all.deb
            ```

            **RHEL/Fedora:**
            ```bash
            sudo rpm -ivh ssh-manager-${{ env.VERSION }}-1.noarch.rpm
            ```

            **Tarball:**
            ```bash
            tar xzf ssh-manager-${{ env.VERSION }}.tar.gz
            cd ssh-manager-${{ env.VERSION }} && sudo ./install.sh
            ```
          files: |
            *.deb
            *.rpm
            *.tar.gz
            SHA256SUMS
            ssh-manager-*.run
          draft: false
          prerelease: false
