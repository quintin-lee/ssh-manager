name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > VERSION

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm makeself

      - name: Build deb + tarball
        run: |
          ./scripts/package.sh
          mkdir -p dist-save
          cp dist/*.deb dist/*.tar.gz dist-save/ 2>/dev/null || true

      - name: Build RPM (Fedora)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace fedora:latest bash -c '
            dnf install -y rpm-build
            ./scripts/package.sh
          '
          cp dist/*.rpm dist-save/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" build dist

      - name: Build .run installer
        run: |
          ./scripts/build_makeself.sh
          cp ssh-manager-*.run dist-save/ 2>/dev/null || true

      - name: Build Arch package
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest bash -c '
            pacman -Sy --noconfirm base-devel expect
            useradd -m builder || usermod -e "" builder
            chown -R builder:builder .
            runuser -u builder -- makepkg -sf --noconfirm --nodeps
            chown root:root ssh-manager-*.pkg.tar.zst
          '
          mv ssh-manager-*.pkg.tar.zst dist-save/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist-save/*.deb
            dist-save/*.rpm
            dist-save/*.tar.gz
            dist-save/*.pkg.tar.zst
            dist-save/ssh-manager-*.run

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, run, tarball, arch]

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

      - name: Verify .deb
        if: matrix.format == 'deb'
        run: |
          sudo dpkg -i ssh-manager_*.deb
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
          test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
          sudo apt remove -y ssh-manager || sudo dpkg -r ssh-manager

      - name: Verify .rpm
        if: matrix.format == 'rpm'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace fedora:latest bash -c '
            dnf install -y expect iputils
            rpm -ivh ssh-manager-*.noarch.rpm
            sshm --version && sshm --help
            printf "nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n" > /tmp/test-config.yaml
            sshm --config /tmp/test-config.yaml --validate
            test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
            test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
            rpm -e ssh-manager
          '

      - name: Verify .run
        if: matrix.format == 'run'
        run: |
          sudo apt-get install -y -qq expect
          chmod +x ssh-manager-*.run
          sudo ./ssh-manager-*.run
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
          test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
          sudo sshm-uninstall || true

      - name: Verify tarball
        if: matrix.format == 'tarball'
        run: |
          TARBALL=$(echo ssh-manager-*.tar.gz)
          tar xzf "$TARBALL"
          TARDIR=$(echo ssh-manager-*/)
          cd "$TARDIR"
          chmod +x install.sh
          sudo ./install.sh
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          sudo ssh-manager-uninstall || true

      - name: Verify Arch
        if: matrix.format == 'arch'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest bash -c '
            pacman -Sy --noconfirm expect
            pacman -U --noconfirm ssh-manager-*.pkg.tar.zst
            sshm --version && sshm --help
            printf "nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n" > /tmp/test-config.yaml
            sshm --config /tmp/test-config.yaml --validate
            test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
            test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
            pacman -R --noconfirm ssh-manager
          '

  release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: .

      - name: Generate checksums
        run: |
          > SHA256SUMS
          for f in *.deb *.rpm *.tar.gz *.pkg.tar.zst; do
            [[ -f "$f" ]] && sha256sum "$f" >> SHA256SUMS
          done
          for f in ssh-manager-*.run; do
            [[ -f "$f" ]] && sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SSH Manager v${{ env.VERSION }}"
          body: |
            ## SSH Manager v${{ env.VERSION }}

            ### Installation

            **Self-extracting (all Linux):**
            ```bash
            sudo ./ssh-manager-${{ env.VERSION }}.run
            ```

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i ssh-manager_${{ env.VERSION }}-1_all.deb
            ```

            **RHEL/Fedora:**
            ```bash
            sudo rpm -ivh ssh-manager-${{ env.VERSION }}-1.noarch.rpm
            ```

            **Arch Linux:**
            ```bash
            sudo pacman -U ssh-manager-${{ env.VERSION }}-*-x86_64.pkg.tar.zst
            ```

            **Tarball (any Linux):**
            ```bash
            tar xzf ssh-manager-${{ env.VERSION }}.tar.gz
            cd ssh-manager-${{ env.VERSION }} && sudo ./install.sh
            ```
          files: |
            *.deb
            *.rpm
            *.tar.gz
            *.pkg.tar.zst
            SHA256SUMS
            ssh-manager-*.run
          draft: false
          prerelease: false
