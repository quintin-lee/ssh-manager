name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bash 5 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Install Bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          cd /tmp/bats-core
          sudo ./install.sh /usr/local
          bats --version

      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck

      - name: Lint scripts
        run: |
          shellcheck --severity=warning bin/sshm.sh scripts/*.sh lib/*.sh

      - name: Run tests
        run: |
          bats tests/

      - name: Syntax check
        run: |
          bash -n bin/sshm.sh
          for f in scripts/*.sh lib/*.sh; do bash -n "$f" || exit 1; done

      - name: Check version consistency
        run: |
          VERSION_FILE=$(cat VERSION)
          echo "VERSION file: $VERSION_FILE"
          grep -q "v${VERSION_FILE}" bin/sshm.sh && echo "Version in sshm.sh matches" || echo "WARNING: version mismatch"

  package-verify:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm makeself

      - name: Build and verify .deb
        run: |
          sudo apt-get install -y -qq expect
          ./scripts/package.sh
          sudo dpkg -i dist/ssh-manager_*.deb
          hash -r
          sshm --version
          sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== uninstall ==="
          sudo apt remove -y ssh-manager || sudo dpkg -r ssh-manager

      - name: Verify .rpm install (Fedora container)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace fedora:latest bash -c '
            dnf install -y expect rpm-build
            ./scripts/package.sh
            rpm -ivh dist/ssh-manager-*.noarch.rpm
            sshm --version
            sshm --help
            printf "nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n" > /tmp/test-config.yaml
            sshm --config /tmp/test-config.yaml --validate
            rpm -e ssh-manager
          '

      - name: Build and verify .run
        run: |
          sudo apt-get install -y -qq expect
          ./scripts/build_makeself.sh
          chmod +x ssh-manager-*.run
          sudo ./ssh-manager-*.run
          hash -r
          sshm --version
          sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== uninstall ==="
          sudo sshm-uninstall || true

      - name: Build and verify tarball
        run: |
          sudo apt-get install -y -qq expect
          TARBALL=$(echo dist/ssh-manager-*.tar.gz)
          tar xzf "$TARBALL"
          cd ssh-manager-*/
          sudo ./install.sh
          hash -r
          sshm --version
          sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== uninstall ==="
          sudo ssh-manager-uninstall || true
