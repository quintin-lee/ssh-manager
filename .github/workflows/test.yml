name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bash 5 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Install Bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          cd /tmp/bats-core
          sudo ./install.sh /usr/local
          bats --version

      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck

      - name: Lint scripts
        run: |
          shellcheck --severity=warning bin/sshm.sh scripts/*.sh lib/*.sh

      - name: Run tests
        run: |
          bats tests/

      - name: Syntax check
        run: |
          bash -n bin/sshm.sh
          for f in scripts/*.sh lib/*.sh; do bash -n "$f" || exit 1; done

      - name: Check version consistency
        run: |
          VERSION_FILE=$(cat VERSION)
          echo "VERSION file: $VERSION_FILE"
          grep -q "v${VERSION_FILE}" bin/sshm.sh && echo "Version matches" || echo "WARNING: version mismatch"

  package-verify:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, run, tarball, arch]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm makeself expect

      - name: Verify .deb
        if: matrix.format == 'deb'
        run: |
          ./scripts/package.sh
          sudo dpkg -i dist/ssh-manager_*.deb
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== verify completions ==="
          test -f /usr/share/bash-completion/completions/sshm && echo "bash completion: OK"
          test -f /usr/share/zsh/site-functions/_sshm && echo "zsh completion: OK"
          source /usr/share/bash-completion/completions/sshm
          complete -p sshm && echo "bash complete registered: OK"
          sudo apt remove -y ssh-manager || sudo dpkg -r ssh-manager

      - name: Verify .rpm
        if: matrix.format == 'rpm'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace fedora:latest bash -c '
            dnf install -y expect iputils
            ./scripts/package.sh
            rpm -ivh dist/ssh-manager-*.noarch.rpm
            sshm --version && sshm --help
            printf "nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n" > /tmp/test-config.yaml
            sshm --config /tmp/test-config.yaml --validate
            echo "=== completions ==="
            test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
            test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
            rpm -e ssh-manager
          '

      - name: Verify .run
        if: matrix.format == 'run'
        run: |
          ./scripts/build_makeself.sh
          chmod +x ssh-manager-*.run
          sudo ./ssh-manager-*.run
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          echo "=== verify completions ==="
          test -f /usr/local/share/bash-completion/completions/sshm 2>/dev/null && echo "bash completion: OK" || true
          test -f /usr/share/bash-completion/completions/sshm && echo "bash completion: OK"
          test -f /usr/share/zsh/site-functions/_sshm && echo "zsh completion: OK"
          sudo sshm-uninstall || true

      - name: Verify tarball
        if: matrix.format == 'tarball'
        run: |
          ./scripts/package.sh
          TARBALL=$(echo dist/ssh-manager-*.tar.gz)
          tar xzf "$TARBALL"
          TARDIR=$(echo ssh-manager-*/)
          cd "$TARDIR"
          chmod +x install.sh
          sudo ./install.sh
          hash -r
          sshm --version && sshm --help
          printf 'nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n' > /tmp/test-config.yaml
          sshm --config /tmp/test-config.yaml --validate
          sudo ssh-manager-uninstall || true

      - name: Verify PKGBUILD
        if: matrix.format == 'arch'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest bash -c '
            pacman -Sy --noconfirm expect base-devel
            useradd -m builder || usermod -e "" builder
            chown -R builder:builder .
            runuser -u builder -- makepkg -sf --noconfirm
            pacman -U --noconfirm ssh-manager-*.pkg.tar.zst
            sshm --version && sshm --help
            printf "nodes:\n  - name: test\n    host: 127.0.0.1\n    user: root\n" > /tmp/test-config.yaml
            sshm --config /tmp/test-config.yaml --validate
            echo "=== completions ==="
            test -f /usr/share/bash-completion/completions/sshm && echo "bash: OK"
            test -f /usr/share/zsh/site-functions/_sshm && echo "zsh: OK"
            pacman -R --noconfirm ssh-manager
          '
